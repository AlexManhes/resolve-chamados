<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#17243b"><meta name="description" content="Resolve: central demonstrativa de chamados, prioridades, responsáveis e prazos de atendimento.">
  <title>Resolve — Central de atendimento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;550;600;650;700&family=Manrope:wght@400;500;600;650;700;750;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css"><script defer src="js/model.js"></script><script defer src="js/app.js"></script>
</head>
<body>
  <aside id="sidebar" class="sidebar"><a href="#dashboard" data-view="dashboard" class="brand" aria-label="Resolve, início"><span class="brand-icon">r<span>•</span></span><span class="brand-name">resolve<span>ATENDIMENTO DESCOMPLICADO</span></span></a><div class="workspace"><span class="workspace-mark">N</span><div><strong>Núcleo Digital</strong><small>Central de atendimento</small></div><span>⌄</span></div><p class="nav-label">WORKSPACE</p><nav id="navigation" aria-label="Navegação principal"></nav><div class="sidebar-bottom"><div class="sidebar-tip"><span>✧</span><strong>Cada chamado importa.</strong><p>Boas conversas resolvem problemas e aproximam pessoas.</p></div><div class="system-online"><i></i>Ambiente de demonstração</div></div></aside>
  <div class="app-shell"><header class="topbar"><div class="breadcrumb"><button id="mobile-menu" class="button ghost mobile-menu" aria-controls="sidebar" aria-expanded="false" aria-label="Abrir menu">☰</button><span>Workspace</span><span>/</span><b id="breadcrumb-title">Visão geral</b></div><div class="topbar-actions"><span class="demo-pill"><i></i>DEMONSTRAÇÃO</span><label class="identity-select"><span class="sr-only">Testar como</span><select id="identity" aria-label="Testar como"></select></label><span id="user-avatar"></span></div></header><main id="content"></main></div>
  <dialog id="form-dialog" aria-labelledby="form-title"><form id="entity-form"><div class="modal-header"><div><div class="eyebrow" id="form-eyebrow">VAMOS RESOLVER JUNTOS</div><h2 id="form-title">Abrir chamado</h2></div><button class="button ghost close-button" type="button" id="close-form" aria-label="Fechar formulário">×</button></div><div id="form-body" class="modal-body"></div><p id="form-error" class="form-error" role="alert" hidden></p><div class="modal-footer"><button class="button secondary" id="cancel-form" type="button">Cancelar</button><button class="button primary" id="save-form" type="submit">Abrir chamado</button></div></form></dialog>
  <dialog id="ticket-dialog" class="ticket-dialog" aria-labelledby="ticket-title"><div class="modal-header"><div><div class="eyebrow" id="ticket-number"></div><h2 id="ticket-title"></h2></div><button id="close-ticket" class="button ghost close-button" aria-label="Fechar detalhes">×</button></div><div id="ticket-body"></div></dialog>
  <dialog id="image-dialog" class="image-dialog" aria-labelledby="image-title"><div class="modal-header"><div><div class="eyebrow">ANEXO DO CHAMADO</div><h2 id="image-title">Print do erro</h2></div><button id="close-image" type="button" class="button ghost close-button" aria-label="Fechar print">×</button></div><div class="image-viewer"><img id="full-print" alt=""></div><p id="image-name" class="image-filename"></p></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
